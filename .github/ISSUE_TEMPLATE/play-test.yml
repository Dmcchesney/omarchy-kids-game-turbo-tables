name: 🏁 Play-test report
description: You or your child raced. Tell us what happened. No names, photos or exact ages.
title: "[Play-test] "
labels: ["play-test"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for playing. Everything here is optional except the confirmation at the end; a
        two-line report is worth having.
  - type: dropdown
    id: who
    attributes:
      label: Who played?
      options: ["An adult", "A child, with me there", "Both"]
    validations:
      required: true
  - type: dropdown
    id: age
    attributes:
      label: Age band, if a child played
      options: ["not applicable", "5–7", "8–10", "11–12", "13+"]
  - type: dropdown
    id: mode
    attributes:
      label: What did you play?
      multiple: true
      options: ["Practice", "Time trial", "Ghost", "Grand Prix"]
  - type: textarea
    id: hand
    attributes:
      label: The power-up hand
      description: When a hand was dealt, did it fire the first time you tried? Was it clear which card was chosen?
  - type: textarea
    id: answer
    attributes:
      label: The answer line
      description: Was it obvious where to type, without being told?
  - type: textarea
    id: story
    attributes:
      label: What worked, what confused, what made them laugh?
  - type: input
    id: screen
    attributes:
      label: Screen size
      placeholder: "1920x1080"
  - type: input
    id: gpu
    attributes:
      label: Graphics hardware
      description: The output of `lspci | grep -i vga`, if you know how. No number from a machine with a GPU exists yet.
  - type: input
    id: cpu
    attributes:
      label: Shell CPU while racing
      description: What `top` shows for omarchy-shell during a race, if you looked.
  - type: textarea
    id: sound
    attributes:
      label: Sound
      description: Nobody who built this has heard it. Anything you noticed.
  - type: checkboxes
    id: consent
    attributes:
      label: Confirmation
      options:
        - label: There are no identifying details about a child in this report.
          required: true
