name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm test
      - run: npm run check:types
      - run: npm run check:boundary
      - run: npm run check:bundle
      - name: Marketplace security baseline
        run: |
          git clone --quiet https://github.com/omacom/omarchy-plugin-marketplace.git ../omarchy-plugin-marketplace
          git -C ../omarchy-plugin-marketplace checkout --quiet 9c59dd37f4b203ba92dbdc69eeb98aa853579146
          npm run scan
